function obstacle(o){

function step(dt,now){

  }else{
   for(let i=0;i<5;i++)coins.push({x:o.x-40+i*20,z:[39,62,76,66,44][i],phase:i});

    $('skin-back').disabled=true;$('home').disabled=true;
    renderShop();
    let errorMessage='';

     skinBusy=false;$('skin-back').disabled=false;$('home').disabled=false;

     if(errorMessage)$('wallet').textContent=errorMessage;

   }
   if(!owned){
    if(wallet.gold<skin.price)return;
    wallet.gold-=skin.price;wallet.owned.push(skin.id);saveWallet();
   }else{
    selectedSkin=skin;
    try{localStorage.setItem('fdc-run-skin',skin.id)}catch{}
   }
   renderShop();
  };
  options.append(choice);
 }
}

let towerTilt=false, tiltCenter=null, tiltAxis=0, tiltSeen=0, tiltAngle=null;
function readTowerTilt(e){
 if(!towerTilt)return;
 const angle=screen.orientation?.angle??window.orientation??0;
 const value=Math.abs(angle)===90?(typeof e.beta==='number'?e.beta*Math.sign(angle):null):
  (typeof e.gamma==='number'?e.gamma*(Math.abs(angle)===180?-1:1):null);
 if(!Number.isFinite(value))return;
 if(tiltCenter===null||tiltAngle!==angle){tiltCenter=value;tiltAngle=angle}
 tiltSeen=performance.now();
 const delta=value-tiltCenter;
 tiltAxis=Math.abs(delta)<3?0:Math.max(-1,Math.min(1,delta/19));
 $('tilt-status').textContent='';
}
window.addEventListener('deviceorientation',readTowerTilt);
$('pause-tilt').onclick=async()=>{
 const button=$('pause-tilt');
 if(!towerTilt){
  const sensor=window.DeviceOrientationEvent;
  if(!sensor){$('tilt-status').textContent='Capteur indisponible. Le tactile reste actif.';return}
  button.disabled=true;
  try{
   if(typeof sensor.requestPermission==='function'&&await sensor.requestPermission()!=='granted')throw Error();
  }catch{
   $('tilt-status').textContent='Accès au capteur refusé. Le tactile reste actif.';return;
  }finally{button.disabled=false}
 }
 towerTilt=!towerTilt;tiltCenter=null;tiltAxis=0;tiltSeen=0;
 button.textContent='Inclinaison : '+(towerTilt?'activée':'désactivée');
 button.setAttribute('aria-pressed',String(towerTilt));
 $('tilt-status').textContent=towerTilt?'Tiens le téléphone droit pour calibrer. Le tactile reste actif.':'';
};
function startTower(){
 game.dataset.play='tower';
 startAccountRun();
 gameType='tower';mode='tower';gold=0;pointer=null;
 tower={x:w/2,y:h*.76,start:h*.76,vy:-350,cam:0,top:h*.76,nextX:w/2,rows:[],count:0,height:0,direction:0,nextBoost:12+Math.floor(Math.random()*5),boostUntil:0};
 tower.rows.push({x:w/2-34,y:tower.y,width:68,kind:'stone'});
 $('opening').hidden=true;$('card').hidden=true;$('zone').textContent='DUNGEON JUMP · GAUCHE / DROITE';
 $('gold').textContent='◆ 0 or';$('score').textContent='0 m';
 $('best').textContent='Rebonds automatiques';
 fillTower();
}
function fillTower(){
 const t=tower;
 while(t.top>t.cam-120){
  const i=++t.count, difficulty=Math.min(1,i/48);
  t.top-=39+Math.random()*9+12*difficulty;
  const width=Math.round(65-difficulty*23);
  t.nextX=Math.max(width/2+23,Math.min(w-width/2-23,t.nextX+(Math.random()-.5)*(83+62*difficulty)));
  const roll=Math.random(), kind=i<5?'stone':roll<.14?'rune':roll<.34?'moving':i>10&&roll<.51?'fragile':'stone';
  const boost=i===t.nextBoost;
  if(boost)t.nextBoost+=25+Math.floor(Math.random()*11);
  const die=!boost&&i>7&&i%4===0&&w>160;
  const dieX=t.nextX<w/2?Math.min(w-19,t.nextX+width/2+45):Math.max(19,t.nextX-width/2-45);
  t.rows.push({x:t.nextX-width/2,y:t.top,width,kind,coin:!boost,seed:Math.random()*6,die,dieX,boost});

 }
}
function platformX(p){
 return p.x+(p.kind==='moving'?Math.sin(performance.now()/620+p.seed)*18:0);
}
function towerEnd(now,reason){
 submitScore('tower',tower.height);
 mode='over';overAt=now;pointer=null;
 $('eyebrow').textContent=reason;$('title').textContent=format(tower.height);
 $('instructions').textContent=gold+' pièces d’or';$('prompt').textContent='TOUCHE POUR REJOUER';$('card').hidden=false;
}
function diePosition(p,now){return {x:p.dieX+Math.sin(now/540+p.seed)*10,y:p.y-31+Math.sin(now/230+p.seed)*3};}
function towerBoostY(p,now){return p.y-22+Math.round(Math.sin(now/160+p.seed)*3)}
function drawTowerBoost(x,y){
 poly([[x,y-13],[x+11,y-7],[x+11,y+7],[x,y+13],[x-11,y+7],[x-11,y-7]],'#472761');
 poly([[x,y-11],[x+9,y-6],[x+9,y+6],[x,y+11],[x-9,y+6],[x-9,y-6]],'#9a5ed8');
 poly([[x,y-10],[x-7,y+6],[x+7,y+6]],'#c08cf4');
 rect(x-2,y-5,4,1,'#fff1d8');rect(x-3,y-4,1,3,'#fff1d8');rect(x+2,y-4,1,3,'#fff1d8');
 rect(x-2,y-1,4,1,'#fff1d8');rect(x-3,y,1,3,'#fff1d8');rect(x+2,y,1,3,'#fff1d8');rect(x-2,y+3,4,1,'#fff1d8');
}
function stepTower(dt,now){
 const t=tower,previous=t.y;
  const axis=pointer!==null?t.direction:towerTilt&&now-tiltSeen<600?tiltAxis:0;
 if(axis){t.x+=axis*205*dt;t.facing=Math.sign(axis)}
 if(t.x<-12)t.x=w+12;if(t.x>w+12)t.x=-12;
 t.vy+=900*dt;t.y+=t.vy*dt;
 for(const p of t.rows){
  const x=platformX(p);
  if(p.boost&&Math.abs(t.x-(x+p.width/2))<20&&Math.abs(t.y-23-towerBoostY(p,now))<23){
   p.boost=false;t.vy=-820;t.boostUntil=now+880;
  }
  if(p.die){
   const die=diePosition(p,now);
   if(Math.abs(t.x-die.x)<18&&Math.abs(t.y-23-die.y)<24){towerEnd(now,'FUMBLE · D20 FACE 1');return}
  }
  if(!p.broken&&t.vy>0&&previous<=p.y&&t.y>=p.y&&t.x+11>x&&t.x-11<x+p.width){
   t.y=p.y;t.landed=now;t.vy=p.kind==='rune'?-455:-350;if(p.kind==='fragile')p.broken=now;
  }
  if(p.coin&&Math.abs(t.x-(x+p.width/2))<21&&Math.abs(t.y-34-(p.y-23))<24){p.coin=false;earn();}
 }
 t.cam=Math.min(t.cam,t.y-h*.37);
 t.height=Math.max(t.height,(t.start-t.y)/12);
 t.rows=t.rows.filter(p=>p.y<t.cam+h+85);fillTower();
 $('score').textContent=format(t.height);
 if(t.y>t.cam+h+45)towerEnd(now,'FIN DE L’ASCENSION');
}

const towerViews=[
 {sky:'#9cc3bd',haze:'#e2c49a',far:'#718c73',near:'#556d54'},
 {sky:'#91b9c0',haze:'#ecd5aa',far:'#829984',near:'#526d64'},
 {sky:'#779cba',haze:'#c5d4d8',far:'#7a8aa3',near:'#526882'},
 {sky:'#546eaa',haze:'#b6cbe5',far:'#7a98c7',near:'#e2e2e2'},
 {sky:'#283858',haze:'#8396bc',far:'#566b96',near:'#bac8df'}

function towerLandscape(view,stage,now,seed){
 rect(0,0,64,42,view.sky);rect(0,36,64,40,view.haze);
 const lightX=47-seed%13;
 rect(lightX-4,14,8,12,'#f4dea9');rect(lightX-6,17,12,6,'#f4dea9');
 for(let i=0;i<3;i++){

 }
 if(stage<2){
  poly([[0,61],[0,52],[14,44],[24,50],[37,43],[47,49],[63,40],[64,75],[0,75]],view.far);
  poly([[0,75],[0,60],[14,55],[27,60],[43,49],[64,57],[64,76]],view.near);

   rect(x,y-7,9,8,'#c6a478');

   rect(x+2,y-5,2,2,'#fae59e');rect(x+6,y-3,2,4,'#745a56');
  }
 }else{
  const y=stage===2?37:stage===3?51:65;
  poly([[0,76],[0,y+16],[14,y+2],[24,y+14],[39,y-8],[64,y+15],[64,76]],view.far);
  poly([[31,y+2],[39,y-8],[50,y+3],[43,y+1],[39,y+5],[36,y+1]],'#e1e8e8');
  if(stage===2)poly([[0,76],[0,68],[16,54],[32,68],[49,58],[64,72],[64,76]],view.near);
  else for(let i=0;i<4;i++){
   const x=(now*.003+seed*13+i*24)%94-19,cloudY=48+i*8;
   rect(x,cloudY,25,7,view.near);rect(x+5,cloudY-5,15,5,'#e0e6e7');

function towerWindow(x,y,size,stage,fade,now,seed){
 ctx.save();ctx.translate(Math.round(x-size/2),Math.round(y));ctx.scale(size/64,size/64);
 const arch=[[0,74],[0,22],[5,22],[5,12],[13,12],[13,5],[22,5],[22,0],[42,0],[42,5],[51,5],[51,12],[59,12],[59,22],[64,22],[64,74]];
 poly(arch,'#857488');
 ctx.save();ctx.beginPath();
 for(let i=0;i<arch.length;i++){
  const [u,v]=arch[i],px=4+u*.875,py=4+v*.89;
  if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
 }
 ctx.closePath();ctx.clip();
 towerLandscape(towerViews[stage],stage,now,seed);
 if(fade){ctx.globalAlpha=fade;towerLandscape(towerViews[stage+1],stage+1,now,seed)}
 ctx.restore();
 rect(0,70,64,4,'#a08a91');rect(-4,74,72,4,'#433443');
 rect(30,7,3,63,'#695968');rect(4,46,56,2,'#695968');
 rect(1,29,2,35,'#a38d96');rect(61,28,2,37,'#473947');
 ctx.restore();
}
function drawTowerBackground(t,now){
 const stage=Math.min(towerViews.length-1,Math.floor(t.height/26));
 const fade=stage<towerViews.length-1?smooth((t.height%26-12)/14):0;
 const edge=blend('#1f202d','#222e49',Math.min(t.height/110,1));
 const center=blend('#48394d','#334462',Math.min(t.height/110,1));
 const gradient=ctx.createLinearGradient(0,0,w,0);gradient.addColorStop(0,edge);gradient.addColorStop(.5,center);gradient.addColorStop(1,edge);
 ctx.fillStyle=gradient;ctx.fillRect(0,0,w,h);
 const firstRow=Math.floor(t.cam/22);
 for(let row=firstRow;row<=firstRow+Math.ceil(h/22);row++){
  const y=row*22-t.cam;
  rect(0,y,w,1,'#6e5a72');
  for(let x=-22+(row&1)*22;x<w;x+=44){
   rect(x,y,1,22,'#2e2639');
   if(Math.abs(row*13+x)%7===0){rect(x+9,y+8,9,1,'#79677c');rect(x+16,y+9,1,4,'#342c40')}
  }
 }
 const stride=151,first=Math.floor(t.cam/stride)-1,size=Math.min(84,w*.26);
 for(let k=first;k<=first+Math.ceil(h/stride)+1;k++){
  const y=k*stride-t.cam;
  for(const [i,x] of [w*.24,w*.76].entries())towerWindow(x,y,size,stage,fade,now,Math.abs(k*3+i*11));
  for(const x of [16,w-16]){
   const base=y+63,flame=Math.round(Math.sin(now/100+k)*2);
   rect(x-3,base,6,10,'#856452');rect(x-4,base-3,8,4,'#a98963');
   rect(x-3,base-10,6,7,'#ea8e58');rect(x-1,base-13+flame,3,9,'#ffd894');
   ctx.save();ctx.globalAlpha=.32;
   for(let j=0;j<4;j++){
    const drift=(now*.016+j*8)%32;
    rect(x+Math.sin(drift/6+k)*5,base-13-drift,2+j%2,2,'#c8a69a');
   }
   ctx.restore();
  }
 }
 ctx.save();ctx.globalAlpha=.25;
 for(let i=0;i<10;i++){
  const y=((i*57-now*.011-t.cam*.24)%h+h)%h;
  rect((i*91+Math.sin(now/900+i)*12+w)%w,y,2,2,'#e5c7a5');
 }
 ctx.restore();
}
function drawTower(){
 const t=tower,now=performance.now();
 drawTowerBackground(t,now);
 for(const p of t.rows){
  if(p.die&&dieArt.complete&&dieArt.naturalWidth){
   const die=diePosition(p,now),dy=die.y-t.cam;
   rect(die.x-14,dy+15,28,2,'#813640');
   ctx.drawImage(dieArt,Math.round(die.x-13),Math.round(dy-14),26,28);

   if(p.boost)drawTowerBoost(x+p.width/2,towerBoostY(p,now)-t.cam);

   if(drop<25)for(let j=0;j<4;j++)rect(x+j*9,y+drop+j*2,4,4,'#9b7462');
   continue;
  }

 }
 if(now<t.boostUntil)for(let i=0;i<7;i++){
  const drift=(now*.07+i*5)%32;
  rect(t.x+Math.round(Math.sin(i*9)*6),t.y-t.cam+drift,3,5,i%2?'#e3bbff':'#965adb');
 }
 drawSkin(t.x,t.y-t.cam,now-t.landed<65?'land':t.vy<0?'jump':'idle',0,t.facing??1);
}
let previousAudioMode;
function frame(now){
 if(previousAudioMode!==mode){previousAudioMode=mode;game.dataset.screen=mode;$('menu-toggle').textContent=mode==='over'?'Menu':'Ⅱ Pause';syncMusic()}
 const dt=Math.min((now-last)/1000,.035);last=now;
 if(mode==='run')step(dt,now);
