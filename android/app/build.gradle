plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'com.fumbledice.games'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fumbledice.games'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'connectivity'
    productFlavors {
        online {
            dimension 'connectivity'
            buildConfigField 'boolean', 'ONLINE', 'true'
        }
        offline {
            dimension 'connectivity'
            applicationIdSuffix '.offline'
            buildConfigField 'boolean', 'ONLINE', 'false'
        }
    }

    sourceSets {
        main.assets.srcDir '../../web'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
